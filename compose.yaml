services:
  gong:
    image: gong:local
    build:
      context: .
      args:
        VERSION: dev
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${GONG_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ./gong.yaml
        target: /etc/gong/gong.yaml
        read_only: true
        bind:
          create_host_path: false
          selinux: Z
    stop_signal: SIGTERM
    stop_grace_period: 35s
